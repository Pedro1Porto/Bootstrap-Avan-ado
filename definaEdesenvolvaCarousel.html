<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>07/04</title>
    <link rel="stylesheet" href="./lib/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div id="carousel-exemplo" class="carousel carousel-fade slide" data-bs-ride="carousel">
            <div class="carousel-inner">
            <div data-bs-interval="2000" class="carousel-item active">
                <img src="https://cdn.pixabay.com/photo/2026/03/31/09/57/09-57-22-678_1280.jpg" alt="Montanhas" class="d-block w-100">
                <div class="carousel-caption">
                    <h2>Mulher na montanha</h2>
                </div>
            </div>
            <div data-bs-interval="2000" class="carousel-item">
                <img src="https://cdn.pixabay.com/photo/2025/09/21/12/13/fennec-fox-9846388_1280.jpg" alt="Raposa" class="d-block w-100">
                <div class="carousel-caption">
                    <h2>Raposa</h2>
                </div>
            </div>
            <div data-bs-interval="2000" class="carousel-item">
                <img src="https://cdn.pixabay.com/photo/2024/11/23/15/37/waterfall-9219262_1280.jpg" alt="Cachoeira" class="d-block w-100">
                <div class="carousel-caption">
                    <h2>Cachoeira</h2>
                </div>
            </div>
        </div>

        <button data-bs-target="#carousel-exemplo" data-bs-slide="prev" class="carousel-control-prev" type="button">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carousel-exemplo" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span> 
        </button>

        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carousel-exemplo" class="active" data-bs-slide-to="0"></button>
            <button type="button" data-bs-target="#carousel-exemplo" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#carousel-exemplo" data-bs-slide-to="2"></button>
        </div>
    </div>
</div>

    <script src="./lib/bootstrap.bundle.min.js"></script>
</body>
</html>
